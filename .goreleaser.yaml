# GoReleaser configuration for the customer-facing CLI.
#
# Adapted from the pattern already in use in studio-ch/packer-plugin-xcloud,
# the repository's other customer-facing Go artifact.
#
# Two things differ from the edge-agent's plain Makefile + action-gh-release
# job in .github/workflows/release.yml, and they are why this config exists
# rather than a sixth hand-rolled shell step:
#
#   1. A CLI needs archives (with the README and shell completions inside),
#      a Homebrew formula and a checksums file — roughly 150 lines
#      of untestable bash, versus ~60 declarative lines here that
#      `goreleaser check` validates locally.
#   2. It releases to a DIFFERENT repository than it builds in. studio-cp is
#      private, so its release assets are not anonymously downloadable, and
#      `brew install` / `curl | sh` / `go install` all require that. The
#      `release.repo` block below publishes to a public releases repo while
#      the build still happens here.
#
# Run `goreleaser check` after editing; CI does the same on any PR touching
# apps/xcloud-cli.
version: 2

project_name: xcloud

# Released by its own tag prefix, from .github/workflows/release-cli.yml.
# A plain vX.Y.Z tag drives the platform release, which builds every Docker
# image and rolls out stage — a CLI fix must not trigger that, and a
# platform release must not bump the CLI's version for no reason.
monorepo:
  tag_prefix: cli/
  dir: apps/xcloud-cli

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go test ./...

builds:
  - id: xcloud
    main: ./cmd/xcloud
    binary: xcloud
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/studio-ch/xcloud-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/studio-ch/xcloud-cli/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/studio-ch/xcloud-cli/internal/buildinfo.Date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM is not a target customers have asked for; drop it
      # rather than ship an artifact nobody verifies.
      - goos: windows
        goarch: arm64

# One artifact that runs on any Mac, so install.sh does not have to sniff
# Apple Silicon versus Intel.
universal_binaries:
  - id: xcloud
    replace: false

archives:
  - id: xcloud
    ids: [xcloud]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      # completions/ is generated by the release workflow before this
      # runs (xcloud completion bash|zsh|fish > completions/…). Shipping
      # them inside the archive lets the Homebrew formula install them
      # without executing the binary at install time.
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  # SHA256SUMS rather than goreleaser's default checksums.txt, to match the
  # name the edge-agent release already publishes.
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish to the public releases repository. studio-cp itself is private,
# so assets released here would need authentication to download — which
# brew, install.sh and a plain curl cannot provide.
#
# REQUIRES: the repo below must exist and RELEASES_REPO_TOKEN must be a PAT
# with contents:write on it. Until both are in place, the release workflow
# will fail at this step (deliberately — a half-published release is worse
# than none).
release:
  github:
    owner: studio-ch
    name: xcloud-cli
  name_template: "xcloud {{ .Version }}"
  header: |
    ## xcloud {{ .Version }}

    Command-line interface for the Cloud Console.

    ```bash
    brew install studio-ch/tap/xcloud
    # or
    curl -fsSL https://raw.githubusercontent.com/studio-ch/xcloud-cli/main/install.sh | sh
    ```
  footer: |
    ---
    Verify a download against `SHA256SUMS`. See `xcloud exit-codes` for the
    scripting contract.

brews:
  - name: xcloud
    ids: [xcloud]
    repository:
      owner: studio-ch
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://cloud.flow.swiss
    description: Command-line interface for the Cloud Console
    install: |
      bin.install "xcloud"
      bash_completion.install "completions/xcloud.bash" => "xcloud"
      zsh_completion.install "completions/xcloud.zsh" => "_xcloud"
      fish_completion.install "completions/xcloud.fish"
    test: |
      system "#{bin}/xcloud", "version", "--client"
    caveats: |
      Authenticate with an API key from the panel (Settings → API keys):

        xcloud auth login
