# GoReleaser configuration for the customer-facing CLI.
#
# Adapted from the pattern already in use in studio-ch/packer-plugin-cloudconsole,
# the repository's other customer-facing Go artifact.
#
# Two things differ from the edge-agent's plain Makefile + action-gh-release
# job in .github/workflows/release.yml, and they are why this config exists
# rather than a sixth hand-rolled shell step:
#
#   1. A CLI needs archives (with the README and shell completions inside),
#      a Homebrew formula and a checksums file — roughly 150 lines
#      of untestable bash, versus ~60 declarative lines here that
#      `goreleaser check` validates locally.
#   2. It releases to a DIFFERENT repository than it builds in. studio-cp is
#      private, so its release assets are not anonymously downloadable, and
#      `brew install` / `curl | sh` / `go install` all require that. The
#      `release.repo` block below publishes to a public releases repo while
#      the build still happens here.
#
# Run `goreleaser check` after editing; CI does the same on any PR touching
# apps/cloudconsole-cli.
version: 2

project_name: cloudconsole

# NOTE: there is deliberately no `monorepo:` block — that is a GoReleaser
# Pro feature and the OSS distribution rejects the config outright.
#
# The monorepo tag prefix is handled in the workflow instead: the tag
# `cli/vX.Y.Z` is translated into GORELEASER_CURRENT_TAG=vX.Y.Z before
# GoReleaser runs, so it sees an ordinary semver tag. That also gives the
# public repository a plain `vX.Y.Z` release, which is what Go's module
# proxy needs for `go install ...@latest`.

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go test ./...

builds:
  - id: cloudconsole
    main: ./cmd/cloudconsole
    binary: cloudconsole
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/studio-ch/cloudconsole-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/studio-ch/cloudconsole-cli/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/studio-ch/cloudconsole-cli/internal/buildinfo.Date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM is not a target customers have asked for; drop it
      # rather than ship an artifact nobody verifies.
      - goos: windows
        goarch: arm64

# One artifact that runs on any Mac, so install.sh does not have to sniff
# Apple Silicon versus Intel.
universal_binaries:
  - id: cloudconsole
    replace: false

archives:
  - id: cloudconsole
    ids: [cloudconsole]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      # completions/ is generated by the release workflow before this
      # runs (cloudconsole completion bash|zsh|fish > completions/…). Shipping
      # them inside the archive lets the Homebrew formula install them
      # without executing the binary at install time.
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  # SHA256SUMS rather than goreleaser's default checksums.txt, to match the
  # name the edge-agent release already publishes.
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

# Disabled: the commit history lives in the private monorepo and covers
# far more than this module, so an auto-generated changelog here would be
# both noisy and full of links nobody outside can open.
changelog:
  disable: true

# Publish to the public releases repository. studio-cp itself is private,
# so assets released here would need authentication to download — which
# brew, install.sh and a plain curl cannot provide.
#
# REQUIRES: RELEASE_TOKEN, a PAT with contents:write on BOTH public repos
# (this one and studio-ch/homebrew-tap). Until it is set the release
# workflow fails here, deliberately — a half-published release is worse
# than none.
release:
  github:
    owner: studio-ch
    name: cloudconsole-cli
  name_template: "cloudconsole {{ .Version }}"
  header: |
    ## cloudconsole {{ .Version }}

    Command-line interface for the Cloud Console.

    ```bash
    brew install studio-ch/tap/cloudconsole
    # or
    curl -fsSL https://raw.githubusercontent.com/studio-ch/cloudconsole-cli/main/install.sh | sh
    ```
  footer: |
    ---
    Verify a download against `SHA256SUMS`. See `cloudconsole exit-codes` for the
    scripting contract.

# `brews:` is deprecated — Homebrew wants casks for pre-built binaries and
# reserves formulae for things it builds from source.
homebrew_casks:
  - name: cloudconsole
    ids: [cloudconsole]
    repository:
      owner: studio-ch
      name: homebrew-tap
      token: "{{ .Env.RELEASE_TOKEN }}"
    directory: Casks
    homepage: https://github.com/studio-ch/cloudconsole-cli
    description: Command-line interface for the Cloud Console
    binaries:
      - cloudconsole
    completions:
      bash: completions/cloudconsole.bash
      zsh: completions/cloudconsole.zsh
      fish: completions/cloudconsole.fish
    hooks:
      post:
        # The binaries are cross-compiled on Linux and therefore neither
        # signed nor notarised. Homebrew marks anything it downloads with
        # the quarantine attribute, and Gatekeeper then refuses to run an
        # unsigned binary outright — so strip it, or `cloudconsole` is
        # killed on first launch with a message that does not explain why.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/cloudconsole"],
                           sudo: false
          end
    caveats: |
      Authenticate with an API key from the panel (Settings -> API keys):

        cloudconsole auth login
